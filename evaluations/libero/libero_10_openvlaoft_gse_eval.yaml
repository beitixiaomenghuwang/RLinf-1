defaults:
  - env/libero_10@env.eval
  - model/openvla_oft@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: all

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_10_openvlaoft_gse_eval"
    logger_backends: ["tensorboard"]
  only_eval: True
  ckpt_path: null # Set to checkpoints/global_step_N/actor/model_state_dict/full_weights.pt

env:
  group_name: "EnvGroup"
  eval:
    # Standard LIBERO-10 has 10 tasks x 50 reset states. Keep only 16 live
    # simulators on four GPUs (4 per rank), then let ordered auto-reset consume
    # the 500-state pool exactly once. The 32 episode windows cover all states;
    # exhausted ranks return sentinel IDs instead of wrapping the pool.
    rollout_epoch: 1
    total_num_envs: 16
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 520
    max_steps_per_rollout_epoch: 16640 # ceil(500 / 16) * 520
    group_size: 1
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    reset_gripper_open: False
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  sampling_params:
    do_sample: False
    temperature_train: 1.6
    temperature_eval: 1.6
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_path: "${oc.env:REPO_PATH}/model/RLinf-OpenVLAOFT-LIBERO-90-Base-Lora/"
    model_type: "openvla_oft"
    implement_version: "rlinf"
    precision: "bf16"
    unnorm_key: libero_90_no_noops_trajall
    max_prompt_length: 128
    is_lora: False
    gse:
      enabled: True
      target_modules:
        [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj, lm_head]
      total_rank: 32
      lora_alpha: 32.0
      num_experts: 8
      num_generalized_experts: 2
      top_k: 2
      initialization: "svd"
      init_seed: 42
      freeze_base: True
