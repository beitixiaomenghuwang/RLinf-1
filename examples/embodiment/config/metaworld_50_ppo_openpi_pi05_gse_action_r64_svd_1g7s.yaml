defaults:
  - env/metaworld_50@env.train
  - env/metaworld_50@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

# Initialization ablation: SVD factors with a fixed backbone offset.
# Tests whether SFT-style MoE-LoRA initialization transfers to PPO, relative
# to the svd_zero main method. Both A0 and B0 contain sqrt(S) magnitudes;
# svd_rho = 1 applies no additional spectral damping.
#
# For this 1g7s arm, GSEAdapter._adjust_base_weight_for_svd subtracts once:
#   C0 = s_g B_g0 A_g0 + (1/7) sum_e s_e B_e0 A_e0
# The adjusted backbone stays frozen, and each forward evaluates:
#   y = (W_sft - C0)x + s_g B_g A_g x + sum_e g_e(x) s_e B_e A_e x
# The sums run over the seven specialized experts; top-k gates sum to one.
# C0 is independent of the input and subsequent router updates. Outputs can
# therefore differ from the SFT policy at step 0. Measure that drift and the
# training dynamics; neither its magnitude nor training failure is assumed.

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor,env: all
    rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "metaworld_50_pi05_gse_action_r64_svd_fixed_offset_1g7s"
    logger_backends: ["tensorboard", "wandb"]
  max_epochs: 180
  max_steps: -1
  only_eval: False
  val_check_interval: 20
  # Must be divisible by val_check_interval: check_progress in
  # rlinf/utils/runner_utils.py asserts save_interval % val_check_interval == 0
  # whenever validation is enabled, and the embodied runner hardcodes
  # limit_val_batches=1.0 so it always is.
  save_interval: 20
  max_checkpoints_to_keep: null
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  advantage_normalization_mode: "global"
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  log_task_advantage_metrics: True
  task_advantage_num_tasks: 50

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 2
    total_num_envs: 128
    use_ordered_reset_state_ids: True
    video_cfg:
      save_video: False
  eval:
    rollout_epoch: 8
    total_num_envs: 64
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 100
    max_steps_per_rollout_epoch: 100
    group_size: 1
    is_eval: True
    use_fixed_reset_state_ids: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  seed: 42
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1
  micro_batch_size: 8
  model:
    model_path: "/path/to/model/RLinf-Pi05-MetaWorld-SFT"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  global_batch_size: 1024
  seed: 42
  enable_offload: False
  model:
    model_path: "/path/to/model/RLinf-Pi05-MetaWorld-SFT"
    num_action_chunks: 5
    action_dim: 4
    add_value_head: True
    is_lora: False
    gse:
      enabled: True
      total_rank: 64
      # lora_alpha MUST track total_rank so scaling_for_rank returns exactly 1.0
      # under scaling_mode "total_rank" (it divides by total_rank, not by the
      # per-expert rank).
      lora_alpha: 64.0
      train_action_adapters: True
      # Spectral initialization: each expert gets disjoint singular
      # triplets and splits sqrt(S / (scaling * svd_rho)) across A and B, so B0
      # is nonzero.
      initialization: "svd"
      # Residual scaling is lora_alpha / total_rank = 1.
      scaling_mode: "total_rank"
      # gse_eta is inert (read only by scaling_mode "gse"). svd_rho and
      # preserve_svd_output are BOTH LIVE on this branch -- they are the two keys
      # that define this arm besides initialization itself.
      gse_eta: 1.0
      svd_rho: 1.0
      # Fold C0 into the frozen backbone once. No per-forward subtraction of
      # the initial factors with the current gates; see the formula above.
      preserve_svd_output: False
      num_experts: 8
      num_generalized_experts: 1
      top_k: 2
      init_seed: 42
      routing_mode: "topk"
      routing_granularity: "token"
      sequence_pooling: "mean"
      router_input: "hidden"
      # Matches the official GSE repo, which never initializes its router and so
      # keeps nn.Linear's own reset_parameters. router_init_std is deliberately
      # unset: "default" does not read it.
      router_initialization: "default"
      # Nonzero dropout disables the fused two-matmul expert path and falls back
      # to a per-expert Python loop, which roughly doubles actor training time.
      lora_dropout: 0.0
      # The Switch-style load-balancing term is minimized at uniform routing, so
      # it opposes task specialization.
      load_balancing_loss_coef: 0.0
      semantic_conditioning: False
      # Judge router specialization by the layerwise metrics, not the aggregate
      # ones; the aggregate sums packed statistics over all injected layers, so
      # layers with opposing task preferences cancel.
      log_task_router_metrics: True
      log_layerwise_task_router_metrics: True
      task_router_num_tasks: 50
      task_router_informative_nmi_threshold: 0.01
      log_router_metrics: True
      # Track A-factor geometry as the nonzero spectral factors are trained.
      log_orthogonality: True
      orthogonality_loss_coef: 0.0
    openpi:
      config_name: "pi05_metaworld"
      num_images_in_input: 1
      value_after_vlm: True
  optim:
    # Keep the existing learning rate for the fixed-offset initialization arm.
    lr: 5.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
    total_training_steps: ${runner.max_epochs}
    lr_warmup_steps: 0
    lr_scheduler: "cosine"
    num_cycles: 0.5
    # A RATE, not min_lr: transformers computes
    # min_lr_rate = min_lr / optimizer.defaults["lr"], and build_optimizer sets
    # lr only per param group, so defaults["lr"] stays at torch AdamW's 1e-3.
    min_lr_rate: 0.1
    # gse_router_lr is deliberately UNSET: the router shares the actor lr,
    # matching the 0.73-eval gse-formal-seed42 reference and the main method.
  fsdp_config:
    adapter_only_checkpoint: True
    save_full_model_weights: False
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    # use_orig_params stays False: True made FSDP validate that every original
    # parameter still aliases its flat-param slot on each forward, and this actor
    # path rebinds a 1152x1152 base projection between rollout and training.
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
