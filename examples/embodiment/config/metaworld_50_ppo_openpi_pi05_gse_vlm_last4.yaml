defaults:
  - env/metaworld_50@env.train
  - env/metaworld_50@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env: all
    rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "metaworld_50_ppo_openpi_pi05_gse_vlm_last4"
    logger_backends: ["tensorboard"]

  # Bounded ablation run, not open-ended training: same scale as the six-GPU
  # single-layer VLM-GSE ablation (HANDOFF.md 9.9), enough steps to see whether
  # matched evaluation against action-only step 180 moves at all.
  max_epochs: 20
  max_steps: -1

  only_eval: False
  val_check_interval: 10
  save_interval: 10
  # A checkpoint contains both DCP training state and full 3.6B model weights.
  max_checkpoints_to_keep: 4

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

  # Diagnostic only: log per-task (MT50) PPO sample counts and advantage
  # mean/std, to decide between tail-task loss weighting and per-task
  # advantage normalization. Does not affect the training objective.
  log_task_advantage_metrics: True
  task_advantage_num_tasks: 50

env:
  group_name: "EnvGroup"
  train:
    # Same eight-GPU rollout budget already validated for action-only GSE
    # training (HANDOFF.md 9.2): 64 parallel envs x 8 rollout epochs.
    rollout_epoch: 8
    total_num_envs: 64
    use_ordered_reset_state_ids: True
    video_cfg:
      save_video: False
  eval:
    rollout_epoch: 1
    # Matches the established 512-trajectory eight-GPU evaluation protocol
    # (HANDOFF.md 9.9/11.1) so this checkpoint can be compared directly against
    # the three-seed action-only baseline without a separate matched re-eval.
    total_num_envs: 500
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 100
    max_steps_per_rollout_epoch: 100
    group_size: 1
    is_eval: True
    use_fixed_reset_state_ids: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  seed: 42
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1

  model:
    # Point this at the resumed action-GSE step-180 checkpoint's actor
    # directory (e.g. "$ACTION_CKPT/actor") when launching; left as a
    # placeholder here since the path is server-specific.
    model_path: "/path/to/model/RLinf-Pi05-MetaWorld-SFT"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # VLM GSE across four language blocks (28 wrapped projections instead of 7)
  # at 4x the per-expert rank of the single-layer ablation (total_rank raised
  # to match the action expert's own capacity, see below) multiplies per-GPU
  # activation memory well beyond the single-layer ablation, which already
  # OOMed at micro_batch_size=128 on six GPUs and required 64. Start
  # conservative at 16 and confirm with the max_epochs=2 smoke run before
  # trusting the full 60-step run; raise toward 32 only if the smoke run shows
  # headroom, and drop to 8 if 16 still OOMs.
  micro_batch_size: 16
  global_batch_size: 2048
  seed: 42
  enable_offload: False

  model:
    # Same placeholder convention as rollout.model.model_path above.
    model_path: "/path/to/model/RLinf-Pi05-MetaWorld-SFT"
    num_action_chunks: 5
    action_dim: 4
    add_value_head: True
    is_lora: False
    openpi_data:
      # The resumed checkpoint directory does not carry norm_stats.json;
      # point this at the original SFT model's copy. Override on the CLI if
      # the local path differs from this placeholder.
      norm_stats_path: "/path/to/model/RLinf-Pi05-MetaWorld-SFT/lerobot/metaworld_mt50/norm_stats.json"
    gse:
      enabled: True
      # Load the step-180 action-GSE checkpoint but freeze its 126 trained
      # action adapters; only the new VLM adapters and the value head train.
      train_action_adapters: False
      load_balancing_loss_coef: 0.0
      orthogonality_loss_coef: 0.0
      log_router_metrics: True
      log_task_router_metrics: True
      task_router_num_tasks: 50
      log_orthogonality: True
      vlm:
        enabled: True
        # Last four language blocks (was layer_indices=[-1] only, HANDOFF.md
        # 9.8/9.9).
        layer_indices: [-4, -3, -2, -1]
        target_modules:
          [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
        # Raised from the single-layer ablation's total_rank=16 to match the
        # action expert's own GSE capacity (action expert relies on the
        # GSEConfig defaults total_rank=64/lora_alpha=64.0); rank 16 (4 per
        # expert) was judged too small relative to hidden_size=2048 to show a
        # clear effect in only 60 steps. lora_alpha scales with total_rank to
        # keep scaling=lora_alpha/total_rank=1.0, same ratio as the
        # single-layer ablation and the action expert.
        total_rank: 64
        lora_alpha: 64.0
        num_experts: 4
        num_generalized_experts: 1
        top_k: 2
        init_seed: 4200
    openpi:
      config_name: "pi05_metaworld"
      num_images_in_input: 1
      value_after_vlm: True

  optim:
    lr: 1.0e-5
    value_lr: 5.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
    total_training_steps: ${runner.max_epochs}
    lr_warmup_steps: 0
    lr_scheduler: "cosine"
    num_cycles: 0.5

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    # Each GSE adapter is one trainable FSDP unit, separate from its frozen base.
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
