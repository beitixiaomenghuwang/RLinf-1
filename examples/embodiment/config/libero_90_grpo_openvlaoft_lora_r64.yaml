# Plain LoRA rank-64 RL baseline for LIBERO-90, matched to
# libero_90_grpo_openvlaoft_gse_r64_svd.yaml everywhere except the adapter:
# same GRPO hyperparameters, same 64x4 training / 32x16 evaluation protocol,
# same batch shape, same 120 steps, same lr and cosine schedule, same
# adapter-only checkpointing. The single variable is the residual
# parameterization -- one always-on LoRA pair per layer instead of eight routed
# GSE experts sharing the same total rank.
defaults:
  - env/libero_90@env.train
  - env/libero_90@env.eval
  - model/openvla_oft@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    # Default only: every launcher passes runner.logger.experiment_name
    # explicitly.
    experiment_name: "libero90_lora_r64_8gpu_seed1234"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: 120

  only_eval: False
  val_check_interval: 20
  # Save every 10 steps, validate every 20. check_progress in
  # rlinf/utils/runner_utils.py requires the two grids to be commensurate, and
  # this is the val % save == 0 direction: every validation lands on a step that
  # was already checkpointed, which is what save_best_macro_mean and the
  # evaluation_complete marker need (the runner saves before it validates). The
  # opposite pairing -- save 10 against val 20 under the OLD one-directional
  # assert -- is what killed job 1471717 at its first eval after 34 minutes.
  save_interval: 10
  save_best_macro_mean: True
  # No cap: adapter-only checkpoints are small, so keeping the whole training
  # trajectory costs less than one old full checkpoint and lets any step be
  # re-evaluated later. Stated explicitly rather than relying on the key being
  # absent, so adding a cap upstream cannot silently start pruning these runs.
  # null disables pruning (prune_old_checkpoints returns early on None).
  max_checkpoints_to_keep: null

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 8

  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level

  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  reward_coef: 5.0

  filter_rewards: True
  rewards_lower_bound: 0.5
  rewards_upper_bound: 4.5

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 4
    total_num_envs: 64
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    reset_gripper_open: False
  eval:
    # Seen-task LIBERO-90 validation: 32 simulators x 16 episode windows give
    # 512 fixed interleaved reset states, covering all 90 tasks with 5-6
    # trials each on four 40-GiB A100s. Unseen-task LIBERO-10 remains a
    # separate standalone evaluation and is not run during training.
    rollout_epoch: 16
    total_num_envs: 32
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    group_size: 1
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    reset_gripper_open: False
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  sampling_params:
    do_sample: True
    temperature_train: 1.6
    # The released LIBERO-90 GRPO policy is evaluated stochastically with
    # temperature 1.6; greedy evaluation underreports it by about 20 points.
    temperature_eval: 1.6
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0

  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: True
  # Match the validated 8-GPU formal rollout configuration.
  micro_batch_size: 8
  pipeline_stage_num: 1

  model:
    model_path: "${oc.env:REPO_PATH}/model/RLinf-OpenVLAOFT-LIBERO-90-Base-Lora/"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # Match the official 8-GPU batch configuration used by the formal run.
  micro_batch_size: 32
  global_batch_size: 16384
  seed: 1234
  enable_offload: True

  model:
    model_path: "${oc.env:REPO_PATH}/model/RLinf-OpenVLAOFT-LIBERO-90-Base-Lora/"
    model_type: "openvla_oft"
    # flash_attention_2 (the model-group default) is behaviorally broken for
    # OpenVLA-OFT inference on every platform tested (x86 and ARM: official
    # GRPO greedy collapses to 2-4%). See HANDOFF.md 12.5b; never revert.
    attn_implementation: "sdpa"
    unnorm_key: libero_90_no_noops_trajall
    max_prompt_length: 128
    # Plain LoRA through RLinf's native PEFT path (rlinf/models/__init__.py
    # get_model). With lora_path null it builds a FRESH LoraConfig and calls
    # get_peft_model on the whole policy; it never loads the lora_adapter/
    # directory shipped with the base model, whose weights are already merged
    # into the four dense shards. Re-merging that adapter is what drops greedy
    # LIBERO-90 from ~96% to ~25%.
    is_lora: True
    lora_path: null
    # PEFT sets lora_alpha = lora_rank there, so the LoRA scaling is
    # alpha / r = 1.0 -- the same residual scaling as the GSE arm's
    # scaling_mode "total_rank" with lora_alpha == total_rank. Dropout is 0 and
    # init_lora_weights is "gaussian" (A gaussian, B zero), so the step-0
    # residual is exactly zero and the initial policy is the SFT policy.
    lora_rank: 64
    # The target list is hardcoded in rlinf/models/__init__.py and covers the
    # vision backbone (proj, qkv, fc1, fc2), the projector (q, kv, fc3,
    # out_proj), the language model (q/k/v/o/gate/up/down_proj) and lm_head.
    # get_peft_model freezes every base parameter, so only the LoRA factors
    # train. This matches the GSE arm now that it also injects into vision.
    # GRPO has no critic, and the openvla_oft model group leaves
    # add_value_head False, so there is no value head to train either.

  optim:
    # Every trainable parameter is a PEFT LoRA factor, and without gse_lr /
    # ortho_hydra_lr build_optimizer puts them all in the single actor group
    # that reads this lr. 6e-5 mirrors the GSE arm's gse_lr, which is the
    # comparable knob because both arms scale their residual by 1.0.
    lr: 6e-5
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 0
    lr_scheduler: "cosine"
    num_cycles: 0.5
    # Decay each param group to 10% of its own initial lr. Expressed as a RATE,
    # not min_lr: transformers computes min_lr_rate = min_lr / optimizer.defaults["lr"],
    # and build_optimizer sets lr only per param group, so defaults["lr"] stays at
    # torch AdamW's own 1e-3. An absolute min_lr is therefore divided by 1e-3
    # regardless of the configured lrs, which silently rescales the floor whenever
    # a group lr changes. min_lr_rate bypasses that division entirely.
    min_lr_rate: 0.1
    # Warm-restart only: preserve Adam state but start a fresh LR schedule.
    reset_lr_scheduler_on_resume: False
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    # A PEFT checkpoint is dominated by the frozen backbone, re-saved verbatim at
    # every step. Measured on a pi0.5 GSE rank-32 checkpoint (job 1468982 step
    # 100): 17G total, of which the adapter tensors were 33.8 MiB. Selection is
    # by optimizer state plus the name markers in
    # hybrid_engines/fsdp/strategy/checkpoint.py, one of which is "lora_", so a
    # PEFT LoRA run is filtered the same way a GSE run is. The frozen base is
    # restored from actor.model.model_path on resume, and loading auto-detects
    # the format from a marker file.
    adapter_only_checkpoint: True
    # full_weights.pt is the whole model, so writing it would restore the cost
    # adapter-only saving removes. Standalone eval via runner.ckpt_path needs a
    # materialized file: rebuild it from the base weights plus one adapter
    # checkpoint instead of re-saving it at every save_interval.
    save_full_model_weights: False
    strategy: "fsdp"
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
