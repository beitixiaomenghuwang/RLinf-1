defaults:
  - env/libero_90@env.train
  - env/libero_10@env.eval
  - model/openvla_oft@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_90_grpo_openvlaoft_gse_r32_svd"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: 160

  only_eval: False
  val_check_interval: 10
  save_interval: 10
  save_best_macro_mean: True

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 8

  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level

  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  reward_coef: 5.0

  filter_rewards: True
  rewards_lower_bound: 0.5
  rewards_upper_bound: 4.5

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 4
    total_num_envs: 64
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    reset_gripper_open: False
  eval:
    # Standard unseen-task LIBERO-10 evaluation: 32 simulators x 16 episode
    # windows cover all 500 ordered reset states once; exhausted slots are
    # masked by the LIBERO eval sentinel instead of wrapping the pool.
    rollout_epoch: 16
    total_num_envs: 32
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 520
    max_steps_per_rollout_epoch: 520
    group_size: 1
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    reset_gripper_open: False
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  sampling_params:
    do_sample: True
    temperature_train: 1.6
    # Periodic LIBERO-10 validation uses the formal deterministic protocol.
    temperature_eval: -1
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0

  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: True
  # Bound GSE inference activations while retaining 64 parallel envs.
  micro_batch_size: 4
  pipeline_stage_num: 1

  model:
    model_path: "${oc.env:REPO_PATH}/model/RLinf-OpenVLAOFT-LIBERO-90-Base-Lora/"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # The largest stable value measured with the formal 1024-sample batch on
  # four 40-GiB A100s. A value of 32 OOMs in the first actor forward pass.
  micro_batch_size: 16
  global_batch_size: 1024
  seed: 1234
  enable_offload: True

  model:
    model_path: "${oc.env:REPO_PATH}/model/RLinf-OpenVLAOFT-LIBERO-90-Base-Lora/"
    model_type: "openvla_oft"
    unnorm_key: libero_90_no_noops_trajall
    max_prompt_length: 128
    is_lora: False
    gse:
      enabled: True
      target_modules:
        [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj, lm_head]
      total_rank: 32
      lora_alpha: 32.0
      num_experts: 8
      num_generalized_experts: 2
      top_k: 2
      initialization: "svd"
      init_seed: 42
      freeze_base: True
      # Match the MetaWorld GSE diagnostic surface: aggregate and layerwise
      # task/router statistics are emitted under train/gse/*.
      log_router_metrics: True
      log_task_router_metrics: True
      log_layerwise_task_router_metrics: True
      task_router_num_tasks: 90
      task_router_informative_nmi_threshold: 0.01
      train_value_head: False
      # With FSDP full_shard/use_orig_params=False, original parameter views
      # cannot be inspected safely outside forward. Measure A-factor
      # orthogonality offline from saved checkpoints instead.
      log_orthogonality: False

  optim:
    # Base learning rate applies to fully-trained visual/OFT weights;
    # GSE adapter parameters use the separate LLM-adapter rate below.
    lr: 2.0e-5
    gse_lr: 1.0e-5
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 0
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 1.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
