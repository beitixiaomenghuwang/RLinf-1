# experts and weight every expert output with its router probability.
runner:
  logger:
    experiment_name: "metaworld_50_pi05_gse_action_r32_svd_rank1_32_specialized"

actor:
  model:
    gse:
      num_experts: 32
      num_generalized_experts: 0
