# Action-only GSE rank ablation. This profile starts from the original SFT
# checkpoint and shares the formal action-GSE PPO/data budget.
defaults:
  - metaworld_50_ppo_openpi_pi05_gse
  - _self_

runner:
  logger:
    experiment_name: "metaworld_50_ppo_openpi_pi05_gse_action_r32"
  max_epochs: 320
  val_check_interval: 20
  save_interval: 20
  max_checkpoints_to_keep: 4
  resume_dir: null
  ckpt_path: null

env:
  train:
    rollout_epoch: 2
    total_num_envs: 128
  eval:
    total_num_envs: 512

actor:
  micro_batch_size: 16
  global_batch_size: 1024
  model:
    model_path: "/path/to/model/RLinf-Pi05-MetaWorld-SFT"
    gse:
      enabled: True
      # total_rank is shared by all eight experts: rank 4 per expert.
      total_rank: 32
      lora_alpha: 32.0
      train_action_adapters: True
  optim:
    lr: 5.0e-5
    # Preserve the scheduler convention used by the formal action-GSE run.
    total_training_steps: 6400

rollout:
  model:
    model_path: "/path/to/model/RLinf-Pi05-MetaWorld-SFT"
