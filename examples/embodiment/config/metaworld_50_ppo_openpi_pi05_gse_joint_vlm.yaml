# Joint action + VLM GSE training from the original SFT checkpoint. Both
# adapter domains are zero-output at initialization and train together. The
# default VLM surface is the last four language blocks; override layer_indices
# on the command line for other layer ranges.
defaults:
  - metaworld_50_ppo_openpi_pi05_gse
  - _self_

runner:
  logger:
    experiment_name: "metaworld_50_ppo_openpi_pi05_gse_joint_vlm"
  max_epochs: 320
  val_check_interval: 20
  save_interval: 10
  # No cap: adapter-only checkpoints are ~110 MiB, so keeping the whole
  # training trajectory costs less than a single old 17G full checkpoint and
  # lets any step be re-evaluated later. null disables pruning entirely
  # (prune_old_checkpoints returns early on None).
  max_checkpoints_to_keep: null
  resume_dir: null
  ckpt_path: null

env:
  train:
    rollout_epoch: 2
    total_num_envs: 128
  eval:
    total_num_envs: 512

actor:
  micro_batch_size: 16
  global_batch_size: 1024
  model:
    model_path: "/path/to/model/RLinf-Pi05-MetaWorld-SFT"
    gse:
      enabled: True
      train_action_adapters: True
      vlm:
        enabled: True
        layer_indices: [-4, -3, -2, -1]
        target_modules:
          [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
        total_rank: 64
        lora_alpha: 64.0
        num_experts: 8
        num_generalized_experts: 1
        top_k: 2
        routing_granularity: token
        init_seed: 4200
  optim:
    # Decay over the complete global-step horizon so the final checkpoints can
    # converge. Add warmup only as a separate early-stability ablation.
    lr: 5.0e-6
    value_lr: 1.0e-4
    total_training_steps: ${runner.max_epochs}
    lr_warmup_steps: 0
    lr_scheduler: "cosine"
    num_cycles: 0.5

rollout:
  model:
    model_path: "/path/to/model/RLinf-Pi05-MetaWorld-SFT"
