model_type: "openpi"

# Optional per-rollout-worker RNG base seed. The rollout config can override it.
seed: null

# Model path - should be set in specific config files
model_path: "/path/to/model/openpi"

precision: null # for openpi, precision is null, please do not change this value

# Action and chunk settings
num_action_chunks: 10
action_dim: 7

# LoRA settings
is_lora: False
lora_rank: 32

# GSE settings. GSE and LoRA are mutually exclusive.
gse:
  enabled: False
  # The rank budget is shared across all experts in each wrapped linear layer.
  total_rank: 64
  lora_alpha: 64.0
  num_experts: 8
  num_generalized_experts: 2
  top_k: 2
  lora_dropout: 0.0
  routing_granularity: "sequence"
  sequence_pooling: "mean"
  initialization: "orthogonal_zero"
  scaling_mode: "total_rank"
  normalize_topk: True
  router_bias: False
  router_init_std: 0.02
  orthogonal_gain: 1.0
  freeze_base: True
  init_seed: 42
  require_pi05: True
  train_value_head: True
  # PPO-side regularization and diagnostics. Coefficients default to zero so
  # enabling GSE alone preserves the original PPO objective.
  load_balancing_loss_coef: 0.0
  orthogonality_loss_coef: 0.0
  log_router_metrics: True
  log_task_router_metrics: False
  task_router_num_tasks: null
  log_orthogonality: True
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  exclude_modules: []

# Training settings
use_proprio: True
num_steps: 5
add_value_head: False

# openpi specific parameters
openpi:
  config_name: "pi05_libero"
  num_images_in_input: 2
  noise_level: 0.5
  action_chunk: ${..num_action_chunks}
  num_steps: ${..num_steps}
  train_expert_only: True
  action_env_dim: ${..action_dim}
  noise_method: "flow_sde"
  add_value_head: ${..add_value_head}
  value_after_vlm: False
  value_vlm_mode: "mean_token"
  detach_critic_input: null

  # DSRL specific configurations (disabled by default)
  use_dsrl: False
  dsrl_state_dim: 8
  dsrl_action_noise_dim: 32
  dsrl_num_q_heads: 10
  dsrl_agg_q: "mean"
  dsrl_image_latent_dim: 64
  dsrl_state_latent_dim: 64
  dsrl_hidden_dims: [128, 128, 128]
