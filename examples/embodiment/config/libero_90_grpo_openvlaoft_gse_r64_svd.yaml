defaults:
  - env/libero_90@env.train
  - env/libero_90@env.eval
  - model/openvla_oft@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    # Default only: every launcher passes runner.logger.experiment_name
    # explicitly. Kept in sync with the arm this file now describes -- rank 64,
    # orthogonal_zero init, scaling 1.0, token routing, vision included.
    experiment_name: "libero90_gse_r64_orthozero_scal1_token_vision_8gpu_seed1234"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: 120

  only_eval: False
  val_check_interval: 20
  # Must be divisible by val_check_interval: check_progress in
  # rlinf/utils/runner_utils.py asserts save_interval % val_check_interval == 0
  # whenever validation is enabled, and the embodied runner hardcodes
  # limit_val_batches=1.0 so it always is. save_interval 10 against
  # val_check_interval 20 crashes at the FIRST eval, not at startup (job
  # 1471717 died there after 34 minutes).
  save_interval: 10
  save_best_macro_mean: True
  # No cap: adapter-only checkpoints are ~110 MiB, so keeping the whole
  # training trajectory costs less than one old 17G full checkpoint and lets
  # any step be re-evaluated later. Stated explicitly rather than relying on
  # the key being absent, so adding a cap upstream cannot silently start
  # pruning these runs. null disables pruning (prune_old_checkpoints returns
  # early on None).
  max_checkpoints_to_keep: null

  # MEASURED NET LOSS on this arm -- left off deliberately.
  #
  # The idea was sound on paper: env bootstrap costs 211 s of a 1850 s step and
  # the env workers are idle while the actor trains, so prefetching the next
  # step's bootstrap should have been free wall clock. Measured A/B at the same
  # batch shape (job 1476720 off, n=6 vs job 1477381 on, n=2, both step>=1):
  #
  #             step      rollout    actor
  #   off       1850 s      576 s    1246 s
  #   on        1889 s      518 s    1344 s     -> +39 s/step NET LOSS
  #
  # rollout did drop by 58 s, but actor training rose by 98 s. The reason is
  # the same one behind this arm's GPU idling: actor training is already CPU
  # SATURATED (GPU util ~50%, process 85% in user time with zero voluntary
  # context switches), so there is no spare CPU in that window to absorb the
  # bootstrap work -- it just competes with the training loop's own dispatch.
  #
  # Re-test it only after the actor phase stops being CPU-bound. Overlap in the
  # framework's real sense (runner.use_training_pipeline) is unavailable here:
  # rlinf/config.py:932 asserts adv_type == "gae" and this arm is GRPO.
  overlap_env_bootstrap: False

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 8

  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level

  adv_type: grpo
  loss_type: actor
  # 1: every rollout batch is consumed exactly once, so training stays fully
  # on-policy. The optimizer-step count is raised purely by data parallelism
  # (global_batch_size 1024 below), not by replaying data.
  #
  # Why the update count had to be raised at all: the MetaWorld GSE arm that
  # DID learn a specialized router (job 1475511: layerwise Cramer's V
  # 0.407 -> 0.458 over 210 steps, success 0.414 -> 0.672) had IDENTICAL GSE
  # settings to this one (rank 64, 8 experts, 1g7s, top_k 2, token routing,
  # orthogonal_zero, scaling 1.0). The difference was the number of optimizer
  # steps per global step:
  #   MetaWorld: 5120 rows / global_batch 1024 x update_epoch 4 = 20 updates
  #   LIBERO   : 16384 rows / global_batch 16384 x (unset = 1) =  1 update
  # A 20x gap. The router suffers most: unlike the static LoRA factors it has
  # to LEARN a routing function, and at one Adam step per rollout its
  # displacement budget is tiny. Over the same 28-step window MetaWorld's
  # Cramer's V moved +0.0117 while LIBERO's moved -0.0093 -- no learning.
  #
  # An earlier attempt used global_batch 4096 + update_epoch 4 (also 16
  # updates). That works too, but replaying each batch 4 times makes the actor
  # phase 4x longer and pushes approx_kl up. Reaching the same 16 updates
  # through a smaller global batch keeps one pass over the data.
  update_epoch: 1
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  reward_coef: 5.0

  filter_rewards: True
  rewards_lower_bound: 0.5
  rewards_upper_bound: 4.5

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 4
    total_num_envs: 64
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    reset_gripper_open: False
  eval:
    # Seen-task LIBERO-90 validation: 32 simulators x 16 episode windows give
    # 512 fixed interleaved reset states, covering all 90 tasks with 5-6
    # trials each on four 40-GiB A100s. Unseen-task LIBERO-10 remains a
    # separate standalone evaluation and is not run during training.
    rollout_epoch: 16
    total_num_envs: 32
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    group_size: 1
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    reset_gripper_open: False
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  sampling_params:
    do_sample: True
    temperature_train: 1.6
    # The released LIBERO-90 GRPO policy is evaluated stochastically with
    # temperature 1.6; greedy evaluation underreports it by about 20 points.
    temperature_eval: 1.6
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0

  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: True
  # Match the validated 8-GPU formal rollout configuration.
  micro_batch_size: 8
  pipeline_stage_num: 1

  model:
    model_path: "${oc.env:REPO_PATH}/model/RLinf-OpenVLAOFT-LIBERO-90-Base-Lora/"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # Match the official 8-GPU batch configuration used by the formal run.
  micro_batch_size: 32
  # 1024, not 16384. A step produces 64 env x 4 epochs x (512/8 chunks) = 16384
  # rows, so the old value made the whole step ONE optimizer update. At 1024 a
  # step is 16 global batches, i.e. 16 optimizer updates with update_epoch 1
  # (MetaWorld's arm gets 20 from 5 batches x 4 epochs). This also matches
  # MetaWorld's global_batch_size exactly, so the number of samples behind each
  # Adam step is the same on both arms.
  #
  # Constraints, all checked by the launcher before any model loads:
  # global_batch % (micro_batch x ranks) == 0 -> 1024 % (16x8) = 0, giving 8
  # accumulation steps; and samples/step % global_batch == 0 -> 16384 % 1024 = 0.
  # The launcher's ACTOR_GLOBAL_BATCH default is kept in sync, because a CLI
  # override outranks this file.
  global_batch_size: 1024
  seed: 1234
  enable_offload: True
  # Deliberately 1, i.e. collect the GSE diagnostics on every optimizer step.
  #
  # The knob samples every Nth GLOBAL batch -- not micro-batch. It cannot be
  # per-micro-batch: toggling the router bookkeeping inside a
  # gradient-accumulation window makes the router receive a gradient on some
  # micro-batches and not others, and FSDP asserts on exactly that
  # ("All sharded parameters that received a gradient in the post-backward
  # should use `_saved_grad_shard`", job 1477193, dead at step 0).
  #
  # And this config has ONE global batch per step (16384 samples /
  # global_batch_size 16384), so N>1 would mean "no router metrics at all for
  # N-1 consecutive steps". Whether the routing metrics move across steps is a
  # required health signal for this experiment, so that trade is not worth
  # taking. The per-layer saving from gating _record_routing is unaffected by
  # this value.
  adapter_metrics_micro_batch_interval: 1

  model:
    model_path: "${oc.env:REPO_PATH}/model/RLinf-OpenVLAOFT-LIBERO-90-Base-Lora/"
    model_type: "openvla_oft"
    # flash_attention_2 (the model-group default) is behaviorally broken for
    # OpenVLA-OFT inference on every platform tested (x86 and ARM: official
    # GRPO greedy collapses to 2-4%). See HANDOFF.md 12.5b; never revert.
    attn_implementation: "sdpa"
    unnorm_key: libero_90_no_noops_trajall
    max_prompt_length: 128
    is_lora: False
    gse:
      enabled: True
      # Whole-model injection: every nn.Linear of the vision backbone, the
      # multimodal projector and the language model is wrapped, and all
      # original weights stay frozen. This is a change from the earlier
      # frozen-vision protocol (228 layers, 96,772,480 trainable parameters);
      # with the vision backbone included the injected-layer count and the
      # activation memory both rise, so the micro-batch and host-memory
      # budgets measured for the frozen-vision runs no longer bound this one.
      # Vision-GSE checkpoints are also incompatible with frozen-vision ones.
      scope: whole_model
      target_modules: all-linear
      freeze_vision_backbone: False
      total_rank: 64
      # lora_alpha == total_rank so scaling_for_rank returns exactly 1.0 under
      # scaling_mode "total_rank". Keep the two in lockstep if the rank changes.
      lora_alpha: 64.0
      num_experts: 8
      num_generalized_experts: 1
      # Standard GSE routing uses hidden states without text conditioning.
      semantic_conditioning: False
      # The selected experts are evaluated together by the fused GSE path.
      top_k: 2
      # Orthogonal A factors with zero B: the residual is elementwise zero at
      # step 0, so the initial policy is exactly the SFT policy. The file name
      # says "svd" for historical reasons; this arm is orthogonal_zero.
      #
      # Note on the earlier justification, which has been retracted: the
      # "bf16 cancellation in the preserve_svd_output residual" does not exist.
      # Measured on the forward output (the quantity the model consumes, not an
      # isolated residual) the bf16 error is 0.29% for preserve=True vs 0.34%
      # for the folded path -- both at the plain-rounding noise floor. The
      # phantom router gradient WAS real, but it is now fixed in
      # rlinf/models/peft/gse/layer.py by using the same non-detached gate on
      # both branches, so it is no longer a reason to avoid svd.
      initialization: "orthogonal_zero"
      init_seed: 42
      freeze_base: True
      # Fixed residual scaling of 1.0 (lora_alpha / total_rank = 64 / 64).
      # The alternative "gse" mode returns sqrt(3 * gse_eta * in_features /
      # expert_rank), i.e. 39.2 at the 4096-wide language-model projections,
      # which folds capacity and step size into one knob. Holding scaling at
      # 1.0 makes rank the only variable across the rank sweep and matches the
      # LIBERO r32 arm and the MetaWorld orthogonal_zero reference.
      scaling_mode: "total_rank"
      # gse_eta, svd_rho and preserve_svd_output only take effect under
      # scaling_mode "gse" / initialization "svd". Under orthogonal_zero,
      # preserve_svd_output is an exact no-op (verified: max abs output
      # difference 0.000e+00 either way, because B starts at 0 so the
      # subtracted branch is identically zero). Stated explicitly rather than
      # omitted so the zero-residual mechanism in use here is unambiguous.
      preserve_svd_output: False
      # Token-level routing: one routing decision per token, matching the
      # official GSE method. action_sequence_routing is removed.
      routing_mode: "topk"
      routing_granularity: "token"
      sequence_pooling: "mean"
      router_input: "hidden"
      # Match the official GSE repo: kaiming_uniform_(a=sqrt(5)) =
      # uniform(+/-1/sqrt(in_features)), std 1/sqrt(3*in_features). The scale
      # tracks in_features automatically, unlike a fixed router_init_std.
      router_initialization: "default"
      # Nonzero dropout disables the fused two-matmul expert path and falls
      # back to a per-expert Python loop, roughly doubling actor training time.
      lora_dropout: 0.0
      # The Switch-style load-balancing term is minimized at uniform routing,
      # so it opposes task specialization. Measured at coef 0.01-0.02 it
      # dominated the PPO objective by more than an order of magnitude.
      load_balancing_loss_coef: 0.0
      orthogonality_loss_coef: 0.0
      # Match the MetaWorld GSE diagnostic surface: aggregate and layerwise
      # task/router statistics are emitted under train/gse/*.
      log_router_metrics: True
      log_task_router_metrics: True
      log_layerwise_task_router_metrics: True
      task_router_num_tasks: 90
      task_router_informative_nmi_threshold: 0.01
      train_value_head: False
      # With FSDP full_shard/use_orig_params=False, original parameter views
      # cannot be inspected safely outside forward. Measure A-factor
      # orthogonality offline from saved checkpoints instead.
      log_orthogonality: True

  optim:
    # Whole-model GSE freezes the dense base, so every trainable policy
    # parameter belongs to the GSE optimizer group below.
    # actor.optim.lr is deliberately absent. freeze_base + train_value_head:False
    # leave no parameter outside the adapter/router groups, so build_optimizer
    # never creates the actor param group that would read it
    # (fsdp_model_manager.py: `if len(params_actor) > 0`). Adding it back would
    # look like a real knob while changing nothing.
    gse_lr: 5e-5
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 0
    lr_scheduler: "cosine"
    num_cycles: 0.5
    # Decay each param group to 10% of its own initial lr. Expressed as a RATE,
    # not min_lr: transformers computes min_lr_rate = min_lr / optimizer.defaults["lr"],
    # and build_optimizer sets lr only per param group, so defaults["lr"] stays at
    # torch AdamW's own 1e-3. An absolute min_lr is therefore divided by 1e-3
    # regardless of the configured lrs, which silently rescales the floor whenever
    # a group lr changes. min_lr_rate bypasses that division entirely.
    min_lr_rate: 0.1
    # Warm-restart only: preserve Adam state but start a fresh LR schedule.
    reset_lr_scheduler_on_resume: False
    adam_beta1: 0.9
    # 0.95, matching the MetaWorld GSE arm. beta2 sets the second-moment window
    # at roughly 1/(1-beta2) updates: 0.999 is a 1000-update window, and this
    # run only performs a few thousand updates in total, so Adam's adaptive
    # scaling would still be warming up for much of training. 0.95 is a 20-update
    # window, which is what the arm that actually learned a router used.
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    # gse_router_lr and gse_router_weight_decay are deliberately UNSET: the
    # router shares the actor lr above, matching the 0.73-eval MetaWorld
    # gse-formal-seed42 reference, whose resolved config has no router lr
    # override. The old 1e-3 was measured to be inert -- see the long note in
    # metaworld_50_ppo_openpi_pi05_gse_action_r32_svd_1g7s.yaml for the numbers.

  fsdp_config:
    # A PEFT checkpoint is dominated by the frozen backbone, re-saved verbatim at
    # every step. Measured on a pi0.5 GSE rank-32 checkpoint (job 1468982 step
    # 100): 17G total, of which the adapter tensors were 33.8 MiB. The rest was
    # 7.94 GiB of frozen base inside the DCP shards plus an 8.0 GiB
    # full_weights.pt copy of the same weights. Every parameter carrying
    # optimizer state was an adapter/router/value_head tensor, and each base
    # tensor differing from model.safetensors differed by exactly its bf16
    # rounding, so the base is frozen and is restored from
    # actor.model.model_path on resume. Load auto-detects the format from a
    # marker file, so a run can switch and still resume from older full
    # checkpoints.
    adapter_only_checkpoint: True
    # full_weights.pt is the whole model, so writing it would restore the cost
    # adapter-only saving removes. Standalone eval via runner.ckpt_path needs a
    # materialized file: rebuild it from the base weights plus one adapter
    # checkpoint instead of re-saving it at every save_interval.
    save_full_model_weights: False
    strategy: "fsdp"
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
