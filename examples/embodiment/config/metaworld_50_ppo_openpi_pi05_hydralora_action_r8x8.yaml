defaults:
  - env/metaworld_50@env.train
  - env/metaworld_50@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

# Baseline arm: HydraLoRA (Tian et al., NeurIPS 2024; github.com/Clin0212/HydraLoRA).
#
# This file is a copy of
# metaworld_50_ppo_openpi_pi05_gse_action_r64_svdzero_1g7s.yaml -- the main
# method -- with ONLY the low-rank parameterization changed. Every other key
# (RL algorithm, env, rollout, batch shape, lr and schedule, seed, FSDP,
# eval protocol, checkpoint cadence, injected modules) is held at the main
# method's values, so any difference in the result is attributable to the
# adapter structure.
#
# WHAT HYDRALORA IS, AND HOW IT IS EXPRESSED HERE
#
# HydraLoRA's claim is an ASYMMETRY: across heads trained on different data the
# A factors converge while the B factors stay distinguishable, so one shared
# down-projection A feeds N separate up-projections B, and a trainable router
# mixes the B outputs. Transcribing upstream's
# peft/tuners/lora.py::Linear.forward
#
#     route_weight = softmax(self.lora_route(x), dim=-1, dtype=float32)
#     for i in range(self.lora_num):
#         result += route_weight[:, :, i].unsqueeze(-1) \
#                   * lora_B{i}(lora_A(dropout(x))) * self.scaling
#
# onto the GSE config surface:
#
#   upstream                              | this file
#   --------------------------------------|-----------------------------------
#   one shared lora_A                      | share_lora_a: True   (new field)
#   lora_num = N free lora_B{i}            | num_experts: 8, num_generalized_experts: 0
#   dense softmax over ALL heads, no top-k | routing_mode: "all"
#   router reads x per token, bias=False   | routing_granularity: "token", router_input: "hidden"
#   kaiming_uniform_(lora_A, a=sqrt(5))    | initialization: "kaiming_zero"
#   zeros_(lora_B{i})                      | (same init; every B starts at 0)
#   kaiming_uniform_(lora_route, a=sqrt(5))| router_initialization: "default"
#   scaling = lora_alpha / r               | scaling_mode: "expert_rank"
#   no auxiliary balance loss              | load_balancing_loss_coef: 0.0
#
# "kaiming_zero" IS upstream's A init, not an approximation: for a weight of
# shape (r, in_features), kaiming_uniform_(a=sqrt(5)) draws from
# uniform(+/- sqrt(6 / ((1 + 5) * in_features))) = uniform(+/- 1/sqrt(in_features)),
# which is exactly what that branch of initialize_expert_factors() produces.
# Verified numerically: with these settings the layer reproduces the upstream
# forward to 4e-16 in float64 (tests/unit_tests/models/test_gse.py::
# test_share_lora_a_matches_the_official_hydralora_forward).
#
# THE RANK BUDGET (the one intended difference from the main method)
#
# Under a shared A, total_rank keeps its GSE meaning -- the SUM of the experts'
# B ranks -- so it no longer equals the rank the residual can express. Every
# head reads through the same A:
#
#     sum_e g_e(x) * s * B_e A x = (sum_e g_e(x) * s * B_e) A x
#
# so at any fixed gate vector the update is rank <= 8, however many heads fire.
# That is HydraLoRA's structure, not a misconfiguration; it is the property the
# arm exists to test.
#
# This arm is matched to the main method on the B budget: 8 heads x rank 8 = 64
# = the main method's total_rank, with the shared A carrying one expert's worth
# of rank (8) instead of 64.
#
#   per injected d x d projection | main method (1g7s) | this arm
#   ------------------------------|--------------------|------------------
#   A parameters                  |  64d               |   8d
#   B parameters                  |  64d               |  64d
#   router parameters             |   7d               |   8d
#   total                         | 135d               |  80d  (59%)
#   active rank per token         |  8 + 2x8 = 24      |   8
#
# The two alternatives considered and rejected: r=14/N=8 matches total
# parameters (134d) but puts the B budget at 112 and gives a non-power-of-two
# rank; r=64/N=8 matches the shared A to the main method's joint A but costs
# 584d, 4.3x the main method, which stops being a parameter-efficient baseline.

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor,env: all
    rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "metaworld_50_pi05_hydralora_action_r8x8"
    logger_backends: ["tensorboard", "wandb"]
  max_epochs: 180
  max_steps: -1
  only_eval: False
  val_check_interval: 20
  # Must be divisible by val_check_interval: check_progress in
  # rlinf/utils/runner_utils.py asserts save_interval % val_check_interval == 0
  # whenever validation is enabled, and the embodied runner hardcodes
  # limit_val_batches=1.0 so it always is.
  save_interval: 20
  max_checkpoints_to_keep: null
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  advantage_normalization_mode: "global"
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  log_task_advantage_metrics: True
  task_advantage_num_tasks: 50

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 2
    total_num_envs: 128
    use_ordered_reset_state_ids: True
    video_cfg:
      save_video: False
  eval:
    rollout_epoch: 8
    total_num_envs: 64
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 100
    max_steps_per_rollout_epoch: 100
    group_size: 1
    is_eval: True
    use_fixed_reset_state_ids: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  seed: 42
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1
  micro_batch_size: 8
  model:
    model_path: "/path/to/model/RLinf-Pi05-MetaWorld-SFT"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  global_batch_size: 1024
  seed: 42
  enable_offload: False
  model:
    model_path: "/path/to/model/RLinf-Pi05-MetaWorld-SFT"
    num_action_chunks: 5
    action_dim: 4
    add_value_head: True
    is_lora: False
    gse:
      enabled: True
      # Sum of the eight heads' B ranks, matched to the main method's
      # total_rank. The shared A below is rank 8, not 64.
      total_rank: 64
      # lora_alpha MUST track the PER-EXPERT rank here, because scaling_mode is
      # "expert_rank" (upstream's alpha / r) rather than the main method's
      # "total_rank". 8 / 8 keeps scaling at exactly 1.0, matching both the main
      # method and the plain-LoRA r64 baseline.
      lora_alpha: 8.0
      train_action_adapters: True
      # THE DEFINING VARIABLE OF THIS ARM. One down-projection A serves all
      # eight heads; only the up-projections B stay separate. Rejected for the
      # spectral initializations, which slice a joint basis per expert and so
      # would silently discard seven eighths of it.
      initialization: "kaiming_zero"
      share_lora_a: True
      # Upstream's scaling is alpha / r with r the shared A's rank, i.e. the
      # per-expert rank, not the summed budget.
      scaling_mode: "expert_rank"
      # Inert. gse_eta is read only by scaling_mode "gse"; svd_rho and
      # preserve_svd_output only by initialization "svd". Stated explicitly so
      # that changing initialization cannot silently pick up stale values.
      gse_eta: 1.0
      svd_rho: 10.0
      preserve_svd_output: False
      # Eight B heads, none of them always-on: HydraLoRA has no shared/general
      # branch, every head goes through the router.
      num_experts: 8
      num_generalized_experts: 0
      # Inert under routing_mode "all", which uses every expert; recorded at the
      # expert count so it cannot be misread as top-2 selection.
      top_k: 8
      init_seed: 42
      # Dense softmax over all eight heads, no top-k sparsification, decided per
      # token -- upstream routes on x itself at every position.
      routing_mode: "all"
      routing_granularity: "token"
      sequence_pooling: "mean"
      router_input: "hidden"
      # nn.Linear's own reset_parameters, i.e. kaiming_uniform_(a=sqrt(5)),
      # which is exactly how upstream initializes lora_route.
      # router_init_std is deliberately unset: "default" does not read it.
      router_initialization: "default"
      # Upstream defaults to 0.05, but the main method and the plain-LoRA
      # baseline both run at 0.0, and any nonzero value here disables the fused
      # two-matmul expert path in favour of a per-expert Python loop that
      # roughly doubles actor training time. Held at the main method's value.
      lora_dropout: 0.0
      # HydraLoRA has no auxiliary balance term, and the main method runs at 0.0
      # as well, so the two agree.
      load_balancing_loss_coef: 0.0
      semantic_conditioning: False
      # Judge router specialization by the layerwise metrics, not the aggregate
      # ones; the aggregate sums packed statistics over all injected layers, so
      # layers with opposing task preferences cancel.
      log_task_router_metrics: True
      log_layerwise_task_router_metrics: True
      task_router_num_tasks: 50
      task_router_informative_nmi_threshold: 0.01
      log_router_metrics: True
      # Off for this arm, unlike the main method. The A-factor orthogonality
      # trace measures cross-expert overlap, which is identically maximal when
      # one A is shared; the remaining single-factor quantity answers a
      # different question and would not be comparable to the main method's.
      log_orthogonality: False
      orthogonality_loss_coef: 0.0
      # Kept on to match the main method: top-k singular values of dL/dB per
      # (layer, expert) at every sampled step.
      log_gradient_spectrum: True
      gradient_spectrum_top_k: 8
    openpi:
      config_name: "pi05_metaworld"
      num_images_in_input: 1
      value_after_vlm: True
  optim:
    # Unchanged from the main method. Both parameterizations start from B == 0,
    # so the step-0 residual is identically zero in each and no lr
    # re-calibration is needed to keep the comparison at matched step size.
    lr: 5.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
    total_training_steps: ${runner.max_epochs}
    lr_warmup_steps: 0
    lr_scheduler: "cosine"
    num_cycles: 0.5
    # A RATE, not min_lr: transformers computes
    # min_lr_rate = min_lr / optimizer.defaults["lr"], and build_optimizer sets
    # lr only per param group, so defaults["lr"] stays at torch AdamW's 1e-3.
    min_lr_rate: 0.1
    # gse_router_lr is deliberately UNSET: the router shares the actor lr,
    # matching the main method.
  fsdp_config:
    adapter_only_checkpoint: True
    save_full_model_weights: False
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    # use_orig_params stays False: True made FSDP validate that every original
    # parameter still aliases its flat-param slot on each forward, and this actor
    # path rebinds a 1152x1152 base projection between rollout and training.
    # The shared A is a single Parameter referenced by eight expert modules
    # inside one adapter FSDP unit, which FSDP1 deduplicates into one flat-param
    # slot with shared-param views.
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
