defaults:
  - metaworld_50_ppo_openpi_pi05_gse_action_r32_svd
  - _self_

# Matched multi-expert ablation: all eight experts are always active and
# uniformly averaged, so no router is used.
runner:
  logger:
    experiment_name: "metaworld_50_pi05_gse_action_r32_svd_no_router"
  max_epochs: 160
  val_check_interval: 20
  # Must be divisible by val_check_interval: check_progress in
  # rlinf/utils/runner_utils.py asserts save_interval % val_check_interval == 0
  # whenever validation is enabled, and the embodied runner hardcodes
  # limit_val_batches=1.0 so it always is. save_interval 10 against
  # val_check_interval 20 crashes at the FIRST eval, not at startup (job
  # 1471717 died there after 34 minutes).
  save_interval: 20

actor:
  model:
    gse:
      routing_mode: "uniform"
      routing_granularity: "token"
      num_generalized_experts: 8
      log_router_metrics: false
      log_task_router_metrics: false
      log_layerwise_task_router_metrics: false
