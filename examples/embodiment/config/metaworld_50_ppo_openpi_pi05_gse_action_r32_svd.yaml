defaults:
  - metaworld_50_ppo_openpi_pi05_gse_action_r32
  - _self_

# Action-only rank-32 GSE with balanced full-SVD factors. A frozen copy of each
# initialized expert is subtracted under the same route, so every step-0 sample
# exactly matches the SFT policy while both live factors remain trainable.
runner:
  logger:
    experiment_name: "metaworld_50_pi05_gse_action_r32_svd_2g6s"
  max_epochs: 240
  val_check_interval: 20
  # Must be divisible by val_check_interval: check_progress in
  # rlinf/utils/runner_utils.py asserts save_interval % val_check_interval == 0
  # whenever validation is enabled, and the embodied runner hardcodes
  # limit_val_batches=1.0 so it always is. save_interval 10 against
  # val_check_interval 20 crashes at the FIRST eval, not at startup (job
  # 1471717 died there after 34 minutes).
  save_interval: 20

actor:
  model:
    gse:
      initialization: "svd"
      # scaling_mode "gse" makes scaling_for_rank return
      #   sqrt(3 * gse_eta * in_features / expert_rank)
      # (rlinf/models/peft/gse/config.py:139-140), so lora_alpha is NEVER READ on
      # this branch -- setting it anywhere below this file is inert. Two
      # consequences worth stating, because both have been misread before:
      #   1. The scaling is NOT 1.0. Measured with gse_eta=1.0 and 8 experts:
      #      27.71 at total_rank 32, 19.60 at 64, 13.86 at 128 (in_features=1024;
      #      double each for in_features=4096).
      #   2. It shrinks as 1/sqrt(expert_rank), which is the method, not an
      #      artifact: rank x scaling^2 = 3*gse_eta*in_features is held constant,
      #      so a low-rank expert gets a proportionally larger residual. Keep
      #      gse_eta at 1.0 across the rank sweep. Do NOT rescale eta per rank to
      #      "hold the scaling fixed" -- that reproduces neither the official GSE
      #      repo (VLA-GSE hardcodes this formula under init_type="gse" and has
      #      no scaling_mode knob) nor a clean ablation. A capacity-only ablation
      #      belongs on scaling_mode: "total_rank" with lora_alpha = expert_rank,
      #      not on a distorted eta.
      scaling_mode: "gse"
      gse_eta: 1.0
      svd_rho: 10.0
      # preserve_svd_output True keeps the SFT function exactly at step 0
      # (measured 0.0000% output deviation). The alternative folds a
      # uniform-router prior into the base weight and is NOT exact (0.7038%).
      # See metaworld_50_ppo_openpi_pi05_gse_action_r32_svd_1g7s.yaml for the
      # full note, including why the "bf16 cancellation" concern was retracted
      # and where the phantom router gradient was fixed.
      preserve_svd_output: True
      num_experts: 8
      num_generalized_experts: 2
      top_k: 2
      init_seed: 42
      routing_granularity: "token"
