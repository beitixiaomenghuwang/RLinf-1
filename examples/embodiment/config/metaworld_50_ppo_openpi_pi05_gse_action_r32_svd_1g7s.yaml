defaults:
  - env/metaworld_50@env.train
  - env/metaworld_50@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

# Official GSE expert structure: one always-on generalized expert and seven
# specialized experts selected by top-k, routed per token as in the upstream
# VLA-GSE implementation.

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor,env: all
    rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "metaworld_50_pi05_gse_action_r32_svd_1g7s"
    logger_backends: ["tensorboard", "wandb"]
  max_epochs: 180
  max_steps: -1
  only_eval: False
  val_check_interval: 20
  save_interval: 10
  max_checkpoints_to_keep: null
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  advantage_normalization_mode: "global"
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  log_task_advantage_metrics: True
  task_advantage_num_tasks: 50

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 2
    total_num_envs: 128
    use_ordered_reset_state_ids: True
    video_cfg:
      save_video: False
  eval:
    rollout_epoch: 1
    total_num_envs: 512
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 100
    max_steps_per_rollout_epoch: 100
    group_size: 1
    is_eval: True
    use_fixed_reset_state_ids: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  seed: 42
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1
  micro_batch_size: 8
  model:
    model_path: "/path/to/model/RLinf-Pi05-MetaWorld-SFT"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  global_batch_size: 1024
  seed: 42
  enable_offload: False
  model:
    model_path: "/path/to/model/RLinf-Pi05-MetaWorld-SFT"
    num_action_chunks: 5
    action_dim: 4
    add_value_head: True
    is_lora: False
    gse:
      enabled: True
      total_rank: 32
      lora_alpha: 32.0
      train_action_adapters: True
      initialization: "svd"
      # scaling_mode "gse" makes scaling_for_rank return
      #   sqrt(3 * gse_eta * in_features / expert_rank)
      # (rlinf/models/peft/gse/config.py:139-140), so lora_alpha is NEVER READ on
      # this branch -- setting it anywhere is inert. Two consequences:
      #   1. The scaling is NOT 1.0. Measured with gse_eta=1.0 and 8 experts:
      #      27.71 at total_rank 32, 19.60 at 64, 13.86 at 128 (in_features=1024;
      #      double each for in_features=4096).
      #   2. It shrinks as 1/sqrt(expert_rank), so a bare total_rank sweep moves
      #      capacity AND residual magnitude at once. This is the VLA-GSE design:
      #      rank × scaling² = constant compensates low-rank structural limits.
      scaling_mode: "gse"
      gse_eta: 1.0
      svd_rho: 10.0
      preserve_svd_output: True
      num_experts: 8
      num_generalized_experts: 1
      top_k: 2
      init_seed: 42
      routing_mode: "topk"
      routing_granularity: "token"
      sequence_pooling: "mean"
      router_input: "hidden"
      # Match the official GSE repo, which never initializes its router and so
      # keeps nn.Linear's own reset_parameters: kaiming_uniform_(a=sqrt(5)) =
      # uniform(+/-1/sqrt(in_features)), std 1/sqrt(3*in_features). The scale
      # tracks in_features automatically, unlike a fixed router_init_std that
      # means very different things at width 32 and width 2048.
      # router_init_std is deliberately unset: "default" does not read it.
      router_initialization: "default"
      # Nonzero dropout disables the fused two-matmul expert path and falls back
      # to a per-expert Python loop, which roughly doubles actor training time.
      lora_dropout: 0.0
      # The Switch-style load-balancing term is minimized at uniform routing, so
      # it opposes task specialization. Measured at coef 0.01-0.02 it dominated
      # the PPO objective by more than an order of magnitude.
      load_balancing_loss_coef: 0.0
      # Standard GSE routing uses action-expert hidden states only.
      semantic_conditioning: False
      # Judge router specialization by the layerwise metrics, not the aggregate
      # ones. gse_task_router_metrics_from_tensor sums the packed statistics over
      # all injected layers before computing nmi/cramers_v, so layers with
      # opposing task preferences cancel: a run measured 0.02 aggregate
      # adjusted_cramers_v against 0.21 layerwise mean and 0.41 layerwise max.
      # Read layerwise_{nmi,adjusted_cramers_v}_{mean,p90,max} and
      # layerwise_informative_fraction.
      log_task_router_metrics: True
      log_layerwise_task_router_metrics: True
      task_router_num_tasks: 50
      task_router_informative_nmi_threshold: 0.01
      log_router_metrics: True
      log_orthogonality: True
      orthogonality_loss_coef: 0.0
    openpi:
      config_name: "pi05_metaworld"
      num_images_in_input: 1
      value_after_vlm: True
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
    total_training_steps: ${runner.max_epochs}
    lr_warmup_steps: 0
    lr_scheduler: "cosine"
    num_cycles: 0.5
    # Decay each param group to 10% of its own initial lr. Expressed as a RATE,
    # not min_lr: transformers computes min_lr_rate = min_lr / optimizer.defaults["lr"],
    # and build_optimizer sets lr only per param group, so defaults["lr"] stays at
    # torch AdamW's own 1e-3. An absolute min_lr is therefore divided by 1e-3
    # regardless of the configured lrs, which silently rescales the floor whenever
    # a group lr changes. min_lr_rate bypasses that division entirely.
    min_lr_rate: 0.1
    # The router is a single Linear(width, 7) whose gradient arrives only
    # through the routing weights, so at the shared 5e-6 it barely moves while
    # the expert factors train. Give it its own param group at 1e-3.
    gse_router_lr: 1.0e-3
    # Weight decay on a softmax router shrinks logits toward zero, which is a
    # pull toward UNIFORM routing -- the same direction as the load-balancing
    # loss this experiment sets to 0.0. So it cannot be large. But 1e-3 is 200x
    # the base lr, and an unregularized router can saturate its softmax into
    # hard routing with dead experts. 0.01 (the global value) shrinks weights
    # ~3% over 3000 optimizer steps: enough to bound logit growth, far too weak
    # to force uniformity. Raise only if router logits diverge; do not raise to
    # "encourage balance", that is what killed specialization before.
    gse_router_weight_decay: 0.01
  fsdp_config:
    # A PEFT checkpoint is dominated by the frozen backbone, re-saved verbatim at
    # every step. Measured on a pi0.5 GSE rank-32 checkpoint (job 1468982 step
    # 100): 17G total, of which the adapter tensors were 33.8 MiB. Every
    # parameter carrying optimizer state was an adapter/router/value_head tensor,
    # and each base tensor differing from model.safetensors differed by exactly
    # its bf16 rounding, so the base is frozen and is restored from
    # actor.model.model_path on resume. Load auto-detects the format from a
    # marker file, so a run can still resume from older full checkpoints.
    adapter_only_checkpoint: True
    # full_weights.pt is the whole model, so writing it would restore the cost
    # adapter-only saving removes. Standalone eval via runner.ckpt_path needs a
    # materialized file: rebuild it from the base weights plus one adapter
    # checkpoint instead of re-saving it at every save_interval.
    save_full_model_weights: False
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    # use_orig_params stays False: True made FSDP validate that every original
    # parameter still aliases its flat-param slot on each forward, and this actor
    # path rebinds a 1152x1152 base projection between rollout and training, so
    # step 1 died with "Cannot writeback when the parameter shape changes" (jobs
    # 1463766/1463767). The routers instead get their own FSDP units via the
    # _is_adapter_router wrap policy, which keeps their names visible to the
    # gse_router_lr optimizer group.
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
