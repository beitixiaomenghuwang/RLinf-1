defaults:
  - env/metaworld_50@env.train
  - env/metaworld_50@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

# Main method: one always-on generalized expert and seven specialized experts
# selected by top-k, routed per token as in the upstream VLA-GSE implementation.
#
# INITIALIZATION IS orthogonal_zero, NOT svd, despite the file name. This is the
# measured result of a head-to-head 8-GPU comparison at matched effective step
# size (greedy eval macro_mean, both from the hash-verified SFT, both 1g7s /
# total_rank 64 / top_k 2 / token routing / no router lr override):
#
#   | arm                       | @19   | @39   | @59   | @79   | @99   | @119  |
#   | orthogonal_zero (1475511) | .5987 | .6662 | .6855 | .6578 | .6829 | .6916 |
#   | svd + preserve (1476347)  | .5885 | .6080 | .5585 |   -   |   -   |   -   |
#
# 12.7 pp apart at step 59 and diverging. Rollout mean over steps 30-70: 0.5993
# vs 0.5288. The cause is subspace lock-in, not step size: svd initializes the
# joint A to the base weight's top-r right singular vectors, so its overlap with
# that subspace is 1.0000 at step 0 (orthogonal_zero: 0.2553), and after 40 steps
# 72% of the learned residual's energy is still inside it (orthogonal_zero: 25%).
# That overlap is INVARIANT to lr -- 0.254 / 0.254 / 0.255 across a 6x sweep --
# so it is a property of where the parameterization starts, not of how far it
# moves. Under RL the useful directions are the ones the SFT policy does NOT
# already emphasize, so biasing the adapter toward the dominant subspace costs
# real performance. Upstream VLA-GSE uses svd successfully under SFT, where
# re-weighting the dominant subspace is the right inductive bias; that does not
# transfer to on-policy RL.
#
# Do not "restore" svd without re-running this comparison.

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor,env: all
    rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "metaworld_50_pi05_gse_action_r32_svd_1g7s"
    logger_backends: ["tensorboard", "wandb"]
  max_epochs: 180
  max_steps: -1
  only_eval: False
  val_check_interval: 20
  # Must be divisible by val_check_interval: check_progress in
  # rlinf/utils/runner_utils.py asserts save_interval % val_check_interval == 0
  # whenever validation is enabled, and the embodied runner hardcodes
  # limit_val_batches=1.0 so it always is. save_interval 10 against
  # val_check_interval 20 crashes at the FIRST eval, not at startup (job
  # 1471717 died there after 34 minutes).
  save_interval: 20
  max_checkpoints_to_keep: null
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  advantage_normalization_mode: "global"
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  log_task_advantage_metrics: True
  task_advantage_num_tasks: 50

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 2
    total_num_envs: 128
    use_ordered_reset_state_ids: True
    video_cfg:
      save_video: False
  eval:
    rollout_epoch: 1
    total_num_envs: 512
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 100
    max_steps_per_rollout_epoch: 100
    group_size: 1
    is_eval: True
    use_fixed_reset_state_ids: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  seed: 42
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1
  micro_batch_size: 8
  model:
    model_path: "/path/to/model/RLinf-Pi05-MetaWorld-SFT"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  global_batch_size: 1024
  seed: 42
  enable_offload: False
  model:
    model_path: "/path/to/model/RLinf-Pi05-MetaWorld-SFT"
    num_action_chunks: 5
    action_dim: 4
    add_value_head: True
    is_lora: False
    gse:
      enabled: True
      total_rank: 32
      # lora_alpha MUST track total_rank so scaling_for_rank returns exactly 1.0
      # under scaling_mode "total_rank" (it divides by total_rank, not by the
      # per-expert rank). Leaving it at 64 while total_rank is 32 gives scaling
      # 2.0 and doubles the effective step: measured 0.01855 vs 0.00928.
      lora_alpha: 32.0
      train_action_adapters: True
      # orthogonal_zero, not svd -- see the header comment for the measured
      # 12.7 pp eval gap and the subspace-lock-in mechanism behind it.
      # Orthogonal A factors with B = 0, so the step-0 residual is elementwise
      # zero and the initial policy is exactly the SFT policy.
      initialization: "orthogonal_zero"
      # scaling_mode MUST be "total_rank" here, paired with orthogonal_zero.
      #
      # "gse" returns sqrt(3 * gse_eta * in_features / expert_rank) -- 27.71 at
      # total_rank 32 with 8 experts, 39.2 at width 4096 -- and its rank
      # compensation only cancels out under SVD init, where |A|,|B| scale as
      # 1/sqrt(scaling) so Adam's relative step is unchanged. Under
      # orthogonal_zero B starts at exactly 0, Adam's step on B is ~lr
      # regardless, and the scaling multiplies the residual directly. Measured
      # at total_rank 64: orthozero + "gse" + lr 2e-5 gives step 0.14642 versus
      # the reference recipe's 0.01307, i.e. 11.2x. That arm would destabilize.
      #
      # Holding scaling at 1.0 also makes rank the only variable across a rank
      # sweep, and matches the 0.6916-eval 1475511 recipe and the 0.73-eval
      # gse-formal-seed42 reference.
      scaling_mode: "total_rank"
      # gse_eta, svd_rho and preserve_svd_output are all inert on this branch:
      # gse_eta is read only by scaling_mode "gse", and svd_rho /
      # preserve_svd_output only by initialization "svd". preserve_svd_output is
      # additionally an exact no-op under orthogonal_zero (verified: max abs
      # output difference 0.000e+00 either way, because B = 0 makes the
      # subtracted branch identically zero, and initial_lora_a is never even
      # populated). They are stated explicitly so that flipping initialization
      # back to "svd" cannot silently pick up stale values.
      gse_eta: 1.0
      svd_rho: 10.0
      preserve_svd_output: False
      num_experts: 8
      num_generalized_experts: 1
      top_k: 2
      init_seed: 42
      routing_mode: "topk"
      routing_granularity: "token"
      sequence_pooling: "mean"
      router_input: "hidden"
      # Match the official GSE repo, which never initializes its router and so
      # keeps nn.Linear's own reset_parameters: kaiming_uniform_(a=sqrt(5)) =
      # uniform(+/-1/sqrt(in_features)), std 1/sqrt(3*in_features). The scale
      # tracks in_features automatically, unlike a fixed router_init_std that
      # means very different things at width 32 and width 2048.
      # router_init_std is deliberately unset: "default" does not read it.
      router_initialization: "default"
      # Nonzero dropout disables the fused two-matmul expert path and falls back
      # to a per-expert Python loop, which roughly doubles actor training time.
      lora_dropout: 0.0
      # The Switch-style load-balancing term is minimized at uniform routing, so
      # it opposes task specialization. Measured at coef 0.01-0.02 it dominated
      # the PPO objective by more than an order of magnitude.
      load_balancing_loss_coef: 0.0
      # Standard GSE routing uses action-expert hidden states only.
      semantic_conditioning: False
      # Judge router specialization by the layerwise metrics, not the aggregate
      # ones. gse_task_router_metrics_from_tensor sums the packed statistics over
      # all injected layers before computing nmi/cramers_v, so layers with
      # opposing task preferences cancel: a run measured 0.02 aggregate
      # adjusted_cramers_v against 0.21 layerwise mean and 0.41 layerwise max.
      # Read layerwise_{nmi,adjusted_cramers_v}_{mean,p90,max} and
      # layerwise_informative_fraction.
      log_task_router_metrics: True
      log_layerwise_task_router_metrics: True
      task_router_num_tasks: 50
      task_router_informative_nmi_threshold: 0.01
      log_router_metrics: True
      log_orthogonality: True
      orthogonality_loss_coef: 0.0
    openpi:
      config_name: "pi05_metaworld"
      num_images_in_input: 1
      value_after_vlm: True
  optim:
    # 5e-5, not the old 2e-5. The 2e-5 was calibrated against scaling_mode
    # "gse" (scaling 27.71); at scaling 1.0 the same lr gives only 0.00379
    # effective residual step versus the 0.6916-eval 1475511 recipe's 0.01307,
    # i.e. 0.29x, which would badly undertrain the arm. Measured at total_rank
    # 32 / scaling 1.0: lr 2e-5 -> 0.00379, 5e-5 -> 0.00928, 7e-5 -> 0.01289.
    #
    # 5e-5 is chosen over 7e-5 because it is the value the 0.73-eval
    # gse-formal-seed42 reference and 1475511 both used, so it keeps this arm on
    # a validated lr rather than an extrapolated one. The residual step is 0.71x
    # of 1475511 purely because total_rank is 32 here rather than 64 -- that is
    # the intended capacity difference, not a scaling mismatch.
    lr: 5.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
    total_training_steps: ${runner.max_epochs}
    lr_warmup_steps: 0
    lr_scheduler: "cosine"
    num_cycles: 0.5
    # Decay each param group to 10% of its own initial lr. Expressed as a RATE,
    # not min_lr: transformers computes min_lr_rate = min_lr / optimizer.defaults["lr"],
    # and build_optimizer sets lr only per param group, so defaults["lr"] stays at
    # torch AdamW's own 1e-3. An absolute min_lr is therefore divided by 1e-3
    # regardless of the configured lrs, which silently rescales the floor whenever
    # a group lr changes. min_lr_rate bypasses that division entirely.
    min_lr_rate: 0.1
    # gse_router_lr is deliberately UNSET: the router shares the actor lr above,
    # matching the 0.73-eval gse-formal-seed42 reference, whose resolved config
    # has no router lr override at all.
    #
    # The old value here was 1e-3. Real-run evidence that it is harmful, from
    # three 8-GPU arms differing only in this key and routing granularity:
    #   - job 1474867 (router lr 1e-3): router normalized_entropy collapsed
    #     0.9217 -> 0.4108 by step 19, while layerwise task NMI stayed flat at
    #     0.037-0.042. Confident routing carrying no task information.
    #   - jobs 1475510/1475511 (router at the shared 5e-5): entropy held at
    #     0.9792 -> 0.9729 and 0.9731 -> 0.9689 through step 39.
    # The reference run itself never specialized its router (entropy 0.9671 ->
    # 0.9534 over 200 steps) and still reached 0.73 eval, so a hot router buys
    # nothing and costs the uniform mixing the working recipe had.
    #
    # Mechanism: the router gradient is noise-dominated under on-policy RL --
    # half-split cosine across 8 independent minibatches is ~0.01. Adam
    # normalizes gradient magnitude, so a larger lr buys a faster RANDOM WALK,
    # and a random walk still grows logit magnitude, which saturates the
    # softmax. Displacement budget at the shared lr is ample regardless: the
    # router has 12288 elements at init norm 1.417, so 200 steps at 5e-5 can
    # move it by up to 78% of its own norm (5e-6 would be the starved regime,
    # 7.8%).
    #
    # Do NOT justify this with a router-only experiment that freezes the
    # experts: under orthogonal_zero, frozen experts keep B == 0, which forces
    # the router gradient to zero by construction, so such a test cannot detect
    # any lr effect at all. It was that flawed isolation which briefly made
    # 1e-3 look inert.
    #
    # gse_router_weight_decay is also unset: it is read only when building the
    # router param group (fsdp_model_manager.py:562), so with no router group it
    # is inert. Its old value equalled the global weight_decay: 0.01 regardless.
  fsdp_config:
    # A PEFT checkpoint is dominated by the frozen backbone, re-saved verbatim at
    # every step. Measured on a pi0.5 GSE rank-32 checkpoint (job 1468982 step
    # 100): 17G total, of which the adapter tensors were 33.8 MiB. Every
    # parameter carrying optimizer state was an adapter/router/value_head tensor,
    # and each base tensor differing from model.safetensors differed by exactly
    # its bf16 rounding, so the base is frozen and is restored from
    # actor.model.model_path on resume. Load auto-detects the format from a
    # marker file, so a run can still resume from older full checkpoints.
    adapter_only_checkpoint: True
    # full_weights.pt is the whole model, so writing it would restore the cost
    # adapter-only saving removes. Standalone eval via runner.ckpt_path needs a
    # materialized file: rebuild it from the base weights plus one adapter
    # checkpoint instead of re-saving it at every save_interval.
    save_full_model_weights: False
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    # use_orig_params stays False: True made FSDP validate that every original
    # parameter still aliases its flat-param slot on each forward, and this actor
    # path rebinds a 1152x1152 base projection between rollout and training, so
    # step 1 died with "Cannot writeback when the parameter shape changes" (jobs
    # 1463766/1463767). The routers instead get their own FSDP units via the
    # _is_adapter_router wrap policy, which keeps their names visible to the
    # gse_router_lr optimizer group.
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
