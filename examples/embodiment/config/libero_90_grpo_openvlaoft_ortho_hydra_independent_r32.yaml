defaults:
  - env/libero_90@env.train
  - env/libero_90@env.eval
  - model/openvla_oft@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero90_ortho_hydra_independent_r32_8gpu_seed1234"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: 120

  only_eval: False
  val_check_interval: 20
  save_interval: 10
  save_best_macro_mean: True
  # No cap: adapter-only checkpoints are ~110 MiB, so keeping the whole
  # training trajectory costs less than one old 17G full checkpoint and lets
  # any step be re-evaluated later. Stated explicitly rather than relying on
  # the key being absent, so adding a cap upstream cannot silently start
  # pruning these runs. null disables pruning (prune_old_checkpoints returns
  # early on None).
  max_checkpoints_to_keep: null

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 8

  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level

  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  reward_coef: 5.0

  filter_rewards: True
  rewards_lower_bound: 0.5
  rewards_upper_bound: 4.5

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 4
    total_num_envs: 64
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    reset_gripper_open: False
  eval:
    # Seen-task LIBERO-90 validation: 32 simulators x 16 episode windows give
    # 512 fixed interleaved reset states, covering all 90 tasks with 5-6
    # trials each on four 40-GiB A100s. Unseen-task LIBERO-10 remains a
    # separate standalone evaluation and is not run during training.
    rollout_epoch: 16
    total_num_envs: 32
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    group_size: 1
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    reset_gripper_open: False
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  sampling_params:
    do_sample: True
    temperature_train: 1.6
    # The released LIBERO-90 GRPO policy is evaluated stochastically with
    # temperature 1.6; greedy evaluation underreports it by about 20 points.
    temperature_eval: 1.6
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0

  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: True
  # Match the validated 8-GPU formal rollout configuration.
  micro_batch_size: 8
  pipeline_stage_num: 1

  model:
    model_path: "${oc.env:REPO_PATH}/model/RLinf-OpenVLAOFT-LIBERO-90-Base-Lora/"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # Match the official 8-GPU batch configuration used by the formal run.
  micro_batch_size: 32
  global_batch_size: 16384
  seed: 1234
  enable_offload: True

  model:
    model_path: "${oc.env:REPO_PATH}/model/RLinf-OpenVLAOFT-LIBERO-90-Base-Lora/"
    model_type: "openvla_oft"
    # flash_attention_2 (the model-group default) is behaviorally broken for
    # OpenVLA-OFT inference on every platform tested (x86 and ARM: official
    # GRPO greedy collapses to 2-4%). See HANDOFF.md 12.5b; never revert.
    attn_implementation: "sdpa"
    unnorm_key: libero_90_no_noops_trajall
    max_prompt_length: 128
    is_lora: False
    gse:
      enabled: False
    ortho_hydra:
      enabled: True
      # PE-RL protocol: freeze the complete vision backbone and adapt only the
      # multimodal projector and language model.
      scope: whole_model
      target_modules: all-linear
      freeze_vision_backbone: True
      # Total rank 32: eight independent rank-4 input/output experts.
      total_rank: 32
      lora_alpha: 32.0
      num_experts: 8
      parameterization: "independent"
      # Dense softmax uses all experts and fuses RMS-pooled rank-32 hidden
      # states with the frozen text embedding.
      semantic_router_scale: 1.0
      init_seed: 42
      freeze_base: True
      train_value_head: False
      load_balancing_loss_coef: 0.0
      log_router_metrics: True
      log_task_router_metrics: True
      log_layerwise_task_router_metrics: True
      task_router_num_tasks: 90
      task_router_informative_nmi_threshold: 0.01
      log_orthogonality: True

  optim:
    # Whole-model Ortho-Hydra freezes the dense base, so every trainable
    # policy parameter belongs to the adapter optimizer group below.
    # actor.optim.lr is deliberately absent. freeze_base + train_value_head:False
    # leave no parameter outside the adapter/router groups, so build_optimizer
    # never creates the actor param group that would read it
    # (fsdp_model_manager.py: `if len(params_actor) > 0`). Adding it back would
    # look like a real knob while changing nothing.
    ortho_hydra_lr: 5e-5
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 0
    lr_scheduler: "cosine"
    num_cycles: 0.5
    # Decay each param group to 10% of its own initial lr. Expressed as a RATE,
    # not min_lr: transformers computes min_lr_rate = min_lr / optimizer.defaults["lr"],
    # and build_optimizer sets lr only per param group, so defaults["lr"] stays at
    # torch AdamW's own 1e-3. An absolute min_lr is therefore divided by 1e-3
    # regardless of the configured lrs, which silently rescales the floor whenever
    # a group lr changes. min_lr_rate bypasses that division entirely.
    min_lr_rate: 0.1
    # Warm-restart only: preserve Adam state but start a fresh LR schedule.
    reset_lr_scheduler_on_resume: False
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    # A PEFT checkpoint is dominated by the frozen backbone, re-saved verbatim at
    # every step. Measured on a pi0.5 GSE rank-32 checkpoint (job 1468982 step
    # 100): 17G total, of which the adapter tensors were 33.8 MiB. The rest was
    # 7.94 GiB of frozen base inside the DCP shards plus an 8.0 GiB
    # full_weights.pt copy of the same weights. Every parameter carrying
    # optimizer state was an adapter/router/value_head tensor, and each base
    # tensor differing from model.safetensors differed by exactly its bf16
    # rounding, so the base is frozen and is restored from
    # actor.model.model_path on resume. Load auto-detects the format from a
    # marker file, so a run can switch and still resume from older full
    # checkpoints.
    adapter_only_checkpoint: True
    # full_weights.pt is the whole model, so writing it would restore the cost
    # adapter-only saving removes. Standalone eval via runner.ckpt_path needs a
    # materialized file: rebuild it from the base weights plus one adapter
    # checkpoint instead of re-saving it at every save_interval.
    save_full_model_weights: False
    strategy: "fsdp"
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
