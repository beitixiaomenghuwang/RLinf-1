defaults:
  - metaworld_50_ppo_openpi_pi05_gse_action_r32_per_task_adv
  - _self_

# Fixed-rank action-only ablation: one shared generalized expert and seven
# routed specialized experts. Advantage normalization remains per-task.
runner:
  logger:
    experiment_name: "metaworld_50_pi05_gse_action_r32_per_task_adv_1g7s"
  max_epochs: 240
  val_check_interval: 20
  save_interval: 20

actor:
  model:
    gse:
      num_generalized_experts: 1
      num_experts: 8
      top_k: 2
