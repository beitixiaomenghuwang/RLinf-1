defaults:
  - env/metaworld_50@env.train
  - env/metaworld_50@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

# Main method: joint hidden-state + text-embedding routing.
#
# Differs from official_1g7s in exactly one variable: semantic_conditioning.
# The router logits become
#   router(mean-pooled action-expert hidden states)
#   + semantic_router_scale * semantic_router(frozen pooled prompt embedding)
# (rlinf/models/peft/gse/layer.py:240-263).
#
# This matters on pi0.5 because the action expert's suffix carries only action
# tokens: language and image tokens live in the prefix and reach the expert only
# through the KV cache. Mean-pooling action-token hidden states therefore leaves
# the router almost no task signal, which is why task-router NMI sat at ~6e-4.
# The semantic branch gives it the instruction directly.
#
# semantic_embedding_dim is resolved from the PaliGemma embedding width at
# injection time; do not set it here.

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor,env: all
    rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "metaworld_50_pi05_gse_r32_svd_topk_semantic_1g7s"
    logger_backends: ["tensorboard", "wandb"]
  max_epochs: 180
  max_steps: -1
  only_eval: False
  val_check_interval: 20
  save_interval: 10
  # No cap: adapter-only checkpoints are ~110 MiB, so keeping the whole
  # training trajectory costs less than a single old 17G full checkpoint and
  # lets any step be re-evaluated later. null disables pruning entirely
  # (prune_old_checkpoints returns early on None).
  max_checkpoints_to_keep: null
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  advantage_normalization_mode: "global"
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  log_task_advantage_metrics: True
  task_advantage_num_tasks: 50

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 2
    total_num_envs: 128
    use_ordered_reset_state_ids: True
    video_cfg:
      save_video: False
  eval:
    rollout_epoch: 1
    total_num_envs: 512
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 100
    max_steps_per_rollout_epoch: 100
    group_size: 1
    is_eval: True
    use_fixed_reset_state_ids: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  seed: 42
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1
  micro_batch_size: 8
  model:
    model_path: "/path/to/model/RLinf-Pi05-MetaWorld-SFT"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  global_batch_size: 1024
  seed: 42
  enable_offload: False
  model:
    model_path: "/path/to/model/RLinf-Pi05-MetaWorld-SFT"
    num_action_chunks: 5
    action_dim: 4
    add_value_head: True
    is_lora: False
    gse:
      enabled: True
      total_rank: 32
      lora_alpha: 32.0
      train_action_adapters: True
      initialization: "svd"
      scaling_mode: "gse"
      gse_eta: 1.0
      svd_rho: 10.0
      preserve_svd_output: True
      num_experts: 8
      num_generalized_experts: 1
      top_k: 2
      init_seed: 42
      routing_mode: "topk"
      routing_granularity: "token"
      sequence_pooling: "mean"
      router_input: "hidden"
      router_initialization: "default"
      lora_dropout: 0.0
      load_balancing_loss_coef: 0.0
      # Main method difference: semantic_conditioning enabled
      semantic_conditioning: True
      semantic_router_scale: 1.0
      log_task_router_metrics: True
      log_layerwise_task_router_metrics: True
      task_router_num_tasks: 50
      task_router_informative_nmi_threshold: 0.01
      log_router_metrics: True
      log_orthogonality: True
      orthogonality_loss_coef: 0.0
    openpi:
      config_name: "pi05_metaworld"
      num_images_in_input: 1
      value_after_vlm: True
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
    total_training_steps: ${runner.max_epochs}
    lr_warmup_steps: 0
    lr_scheduler: "cosine"
    num_cycles: 0.5
    gse_router_lr: 1.0e-3
    gse_router_weight_decay: 0.01
  fsdp_config:
    adapter_only_checkpoint: False
    save_full_model_weights: False
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
