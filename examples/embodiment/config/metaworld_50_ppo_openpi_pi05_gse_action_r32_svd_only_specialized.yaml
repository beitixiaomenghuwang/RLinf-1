defaults:
  - metaworld_50_ppo_openpi_pi05_gse_action_r32_svd
  - _self_

# Matched expert-structure ablation: remove the always-active generalized
# branch and route across all eight specialized experts.
runner:
  logger:
    experiment_name: "metaworld_50_pi05_gse_action_r32_svd_only_specialized"
  max_epochs: 160
  val_check_interval: 20
  save_interval: 20

actor:
  model:
    gse:
      num_generalized_experts: 0
      top_k: 8
