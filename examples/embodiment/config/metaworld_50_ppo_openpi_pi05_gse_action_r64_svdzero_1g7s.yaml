defaults:
  - env/metaworld_50@env.train
  - env/metaworld_50@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

# Initialization ablation arm B2: svd_zero (RLPO-style spectral direction).
#
# This file is a byte-for-byte copy of
# metaworld_50_ppo_openpi_pi05_gse_action_r64_ortho_zero_1g7s.yaml -- the 1g7s
# orthogonal_zero reference -- with EXACTLY ONE
# key changed: actor.model.gse.initialization. Do not let any other key drift.
#
# WHAT THIS ARM SEPARATES
#
# The head-to-head in the main config's header showed svd losing 12.7 pp to
# orthogonal_zero, and we attributed it to subspace lock-in: svd starts the
# joint A inside the base weight's top-r right singular subspace (overlap
# 1.0000 vs 0.2553) and the learned residual stays ~72% inside it.
#
# That attribution is not identified, because svd changes TWO things at once:
#   (1) the SUBSPACE  -- A = the base's leading right singular vectors;
#   (2) the MAGNITUDE -- sqrt(S / (scaling * rho)) is baked into both A and B,
#                        which also makes B nonzero at step 0.
# svd_zero keeps (1) and drops (2): A is still exactly the base's leading right
# singular vectors, but row-orthonormal at orthogonal_gain like orthogonal_zero,
# and B == 0 so the step-0 residual is elementwise zero.
#
# Measured on a synthetic 1024x1024 layer with a decaying spectrum, 1g7s,
# total_rank 64, top_k 2, 40 AdamW steps at lr 5e-5
# (.tmp_env_patch/svd_zero_check.py):
#
#   | arm             | step-0 err | |A|   | |B|   | A overlap | |dW|/|W| | grad_norm | residual overlap |
#   |-----------------|------------|-------|-------|-----------|----------|-----------|------------------|
#   | orthogonal_zero |   0.000000 | 8.000 | 0.000 |    0.2553 |  0.04002 |    0.0142 |            0.254 |
#   | svd_zero        |   0.000000 | 8.000 | 0.000 |    1.0000 |  0.04009 |    0.0147 |            0.998 |
#   | svd + preserve  |   0.000000 | 2.401 | 2.401 |    1.0000 |  0.01520 |    0.0065 |            0.735 |
#
# Against orthogonal_zero this arm matches |A| to 3 decimals, effective step to
# 0.2%, and grad norm to 3%, so the SUBSPACE is the only thing that moves. Note
# the residual overlap: because A barely moves while |A| = 8, svd_zero is MORE
# locked into the principal subspace (0.998) than svd itself (0.735). It is the
# maximal dose of the mechanism we blamed, which is what makes it a sharp test.
#
# HOW TO READ THE RESULT (decide before the run, not after)
#
#   svd_zero ~= orthogonal_zero  -> the subspace does NOT matter. Our lock-in
#       story is REFUTED and the svd loss must be attributed to the sqrt(S)
#       magnitude, matching arXiv 2606.31813 (ICML 2026), whose RLPO uses this
#       exact initialization and beats plain LoRA on LLM RLVR.
#   svd_zero << orthogonal_zero  -> the subspace DOES matter; lock-in survives
#       with a monotone dose-response (25% -> 73% -> 99.8% overlap), and we are
#       reporting a VLA result that contradicts RLPO's LLM result.
#   svd_zero >  orthogonal_zero  -> free upgrade; revisit the main method.
#
# Everything else -- total_rank, scaling_mode, lora_alpha, lr, routing, router
# init, batch shape, eval protocol -- is held at the main method's values.

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor,env: all
    rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "metaworld_50_pi05_gse_action_r64_svdzero_1g7s"
    logger_backends: ["tensorboard", "wandb"]
  max_epochs: 180
  max_steps: -1
  only_eval: False
  val_check_interval: 20
  # Must be divisible by val_check_interval: check_progress in
  # rlinf/utils/runner_utils.py asserts save_interval % val_check_interval == 0
  # whenever validation is enabled, and the embodied runner hardcodes
  # limit_val_batches=1.0 so it always is.
  save_interval: 20
  max_checkpoints_to_keep: null
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  advantage_normalization_mode: "global"
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  log_task_advantage_metrics: True
  task_advantage_num_tasks: 50

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 2
    total_num_envs: 128
    use_ordered_reset_state_ids: True
    video_cfg:
      save_video: False
  eval:
    rollout_epoch: 8
    total_num_envs: 64
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 100
    max_steps_per_rollout_epoch: 100
    group_size: 1
    is_eval: True
    use_fixed_reset_state_ids: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  seed: 42
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1
  micro_batch_size: 8
  model:
    model_path: "/path/to/model/RLinf-Pi05-MetaWorld-SFT"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  global_batch_size: 1024
  seed: 42
  enable_offload: False
  model:
    model_path: "/path/to/model/RLinf-Pi05-MetaWorld-SFT"
    num_action_chunks: 5
    action_dim: 4
    add_value_head: True
    is_lora: False
    gse:
      enabled: True
      total_rank: 64
      # lora_alpha MUST track total_rank so scaling_for_rank returns exactly 1.0
      # under scaling_mode "total_rank" (it divides by total_rank, not by the
      # per-expert rank).
      lora_alpha: 64.0
      train_action_adapters: True
      # THE ONE VARIABLE OF THIS ARM. A = the base weight's leading right
      # singular vectors, row-orthonormal at orthogonal_gain; B = 0, so the
      # step-0 residual is elementwise zero and the base weight is never folded.
      # See the header for what each possible outcome licenses us to conclude.
      initialization: "svd_zero"
      # Unchanged from the main method. Under svd_zero, B starts at exactly 0
      # just as under orthogonal_zero, so the same reasoning applies: "gse"
      # scaling would multiply the residual directly rather than cancelling out,
      # and 1.0 keeps this arm's effective step matched to the reference recipe.
      scaling_mode: "total_rank"
      # All three are inert here. gse_eta is read only by scaling_mode "gse";
      # svd_rho and preserve_svd_output are read only by initialization "svd" --
      # svd_zero does not consume the singular VALUES at all, only the vectors,
      # and needs no output correction because B == 0. Stated explicitly so that
      # flipping initialization cannot silently pick up stale values.
      gse_eta: 1.0
      svd_rho: 10.0
      preserve_svd_output: False
      num_experts: 8
      num_generalized_experts: 1
      top_k: 2
      init_seed: 42
      routing_mode: "topk"
      routing_granularity: "token"
      sequence_pooling: "mean"
      router_input: "hidden"
      # Matches the official GSE repo, which never initializes its router and so
      # keeps nn.Linear's own reset_parameters. router_init_std is deliberately
      # unset: "default" does not read it.
      router_initialization: "default"
      # Nonzero dropout disables the fused two-matmul expert path and falls back
      # to a per-expert Python loop, which roughly doubles actor training time.
      lora_dropout: 0.0
      # The Switch-style load-balancing term is minimized at uniform routing, so
      # it opposes task specialization.
      load_balancing_loss_coef: 0.0
      semantic_conditioning: False
      # Judge router specialization by the layerwise metrics, not the aggregate
      # ones; the aggregate sums packed statistics over all injected layers, so
      # layers with opposing task preferences cancel.
      log_task_router_metrics: True
      log_layerwise_task_router_metrics: True
      task_router_num_tasks: 50
      task_router_informative_nmi_threshold: 0.01
      log_router_metrics: True
      # Keep this on for the arm: the A-factor orthogonality trace is how we
      # check whether svd_zero's A stays inside the principal subspace during
      # training, which is the quantity the whole ablation turns on.
      log_orthogonality: True
      orthogonality_loss_coef: 0.0
    openpi:
      config_name: "pi05_metaworld"
      num_images_in_input: 1
      value_after_vlm: True
  optim:
    # Same as the main method. Unlike svd, svd_zero starts B at exactly 0, so
    # the effective residual step at this lr is within 0.2% of orthogonal_zero's
    # (0.04009 vs 0.04002 measured at total_rank 64) and no lr re-calibration is
    # needed to keep the comparison at matched step size.
    lr: 5.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
    total_training_steps: ${runner.max_epochs}
    lr_warmup_steps: 0
    lr_scheduler: "cosine"
    num_cycles: 0.5
    # A RATE, not min_lr: transformers computes
    # min_lr_rate = min_lr / optimizer.defaults["lr"], and build_optimizer sets
    # lr only per param group, so defaults["lr"] stays at torch AdamW's 1e-3.
    min_lr_rate: 0.1
    # gse_router_lr is deliberately UNSET: the router shares the actor lr,
    # matching the 0.73-eval gse-formal-seed42 reference and the main method.
  fsdp_config:
    adapter_only_checkpoint: True
    save_full_model_weights: False
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    # use_orig_params stays False: True made FSDP validate that every original
    # parameter still aliases its flat-param slot on each forward, and this actor
    # path rebinds a 1152x1152 base projection between rollout and training.
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
